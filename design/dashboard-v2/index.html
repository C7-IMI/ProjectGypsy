<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="gypsy-token" content="__TOKEN__">
<title>Gypsy Studio — operations console</title>
<link rel="stylesheet" href="/classic.css">
<link rel="stylesheet" href="/mockups.css">
<link rel="stylesheet" href="/app.css">
<script defer src="/app.js"></script></head>
<body><a class="skip" href="#shell">Skip to view content</a><div class="app">
  <header class="top">
    <div class="brand"><span class="mark"></span><div><b>Gypsy Studio</b><small>operations console</small></div></div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" aria-selected="true" data-view="overview">Overview</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-view="insights">Insights</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-view="slices">Slices</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-view="artifacts">Artifacts</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-view="mission">Mission</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-view="commands">Commands</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-view="review">Review</button>
      <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-view="run">Run detail</button>
      <a class="classic" href="/classic">Classic views →</a>
    </nav>
    <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search runs, slices, artifacts…" autocomplete="off" aria-label="Search runs, slices and artifacts"><span class="key">Ctrl K</span></label>
    <button class="btn ghost small" id="refresh" aria-label="Refresh state">Refresh</button>
    <button class="btn primary" id="run-all">▶ Run all gates</button>
    <div class="avatar" aria-hidden="true">SS</div>
  </header>
  <div id="shell" class="body" role="main" tabindex="-1"><div class="loading">Connecting to the local workstream…</div></div>
  <footer class="foot"><span>LOCAL ONLY · 127.0.0.1</span><span class="grow"></span><span>CLI source of truth</span><span class="grow"></span><span class="cmd">python workstream/gypsy.py slices run --all</span><span>v0.25</span></footer>
</div>
<div class="job" id="job" aria-live="polite"><div class="job-h"><span id="job-state" class="status">RUNNING</span><span class="live" id="job-live">LIVE</span><b id="job-title">run</b><button class="close" id="job-close" aria-label="Close job drawer">×</button></div><div class="job-body" id="job-output"></div><div class="job-actions" id="job-actions"></div><div class="job-foot"><span id="job-meta"></span></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="dialog"><h3 id="modal-title">Run command?</h3><p id="modal-hint">This executes a real local command and writes state.</p><div class="cmd" id="modal-cmd"></div><div class="row"><button class="btn ghost" id="modal-cancel">Cancel</button><button class="btn primary" id="modal-run">Run</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body></html>
